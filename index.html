<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>קיצו קאנג׳י — מסלול הדיו</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+Hebrew:wght@400;600;700;800&display=swap" rel="stylesheet" />
<meta name="theme-color" content="#f6f9ff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f6f9ff; --bg2: #ffffff; --bg3: #e9eff7; --bg4: #dce6f1;
  --amber: #2dbe7c; --amber-light: #4bd696; --amber-dark: #15945d;
  --green: #2dbe7c; --red: #ff667a; --orange: #f5a947; --blue: #4d9ef7; --purple: #8b7cf6;
  --sun: #ffc857; --coral: #ff7b66; --ink: #25324a;
  --text: #25324a; --text2: #5f6f88; --text3: #8a99ad;
  --radius: 20px; --shadow: 0 4px 0 #dfe7f0, 0 11px 24px rgba(44,63,91,0.08);
  --glass: #ffffff; --glass-border: #e2eaf3;
  --glow-amber: 0 4px 0 #c8eadb, 0 13px 28px rgba(45,190,124,0.14);
}
[data-theme="dark"] {
  --bg: #172033; --bg2: #202c43; --bg3: #2c3a54; --bg4: #394963;
  --text: #f4f7fb; --text2: #b7c3d5; --text3: #8290a7; --ink: #f4f7fb;
  --glass: #202c43; --glass-border: #34445f;
  --shadow: 0 4px 0 #111827, 0 11px 24px rgba(0,0,0,0.18);
  --glow-amber: 0 4px 0 #176e4a, 0 13px 28px rgba(45,190,124,0.12);
}
html { font-size: 16px; }
body {
  font-family: 'Noto Sans Hebrew', 'Noto Sans JP', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
  background-image: radial-gradient(circle at 1px 1px, rgba(77,158,247,0.08) 1px, transparent 0);
  background-size: 22px 22px;
  background-attachment: fixed;
}
input, select, textarea, button { font-family: inherit; }
button { cursor: pointer; border: none; background: none; color: inherit; }
.jp { font-family: 'Noto Sans JP', sans-serif; direction: ltr; }
.display-font { font-family: 'Fredoka', 'Noto Sans Hebrew', sans-serif; }
.ltr { direction: ltr; text-align: left; }

@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
@keyframes scaleIn { from { transform:scale(0.9); opacity:0; } to { transform:scale(1); opacity:1; } }
@keyframes flipIn { from { transform:rotateY(90deg); } to { transform:rotateY(0); } }
@keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.15); } }
@keyframes xpFloat { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-60px); } }
@keyframes streak { 0% { transform:scale(1); } 25% { transform:scale(1.3); } 50% { transform:scale(1); } }
.fade-in { animation: fadeIn 0.4s ease-out; }
.scale-in { animation: scaleIn 0.3s ease-out; }
.flip-in { animation: flipIn 0.5s ease-out; }
.pulse { animation: pulse 0.6s ease-in-out; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }

#root { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 70px; }
.nav-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; background: var(--bg2);
  border-top: 1px solid var(--glass-border); display: flex; z-index: 100;
  padding: 4px 0; padding-bottom: env(safe-area-inset-bottom, 4px);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 8px 2px; font-size: 9px; color: var(--text3); transition: color 0.2s; gap: 2px;
}
.nav-btn.active { color: var(--amber); }
.nav-btn .nav-icon { font-size: 22px; }
.card {
  background: var(--bg2); border-radius: var(--radius); padding: 20px;
  border: 1px solid var(--glass-border); margin-bottom: 12px;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow);
}
.card-glow { box-shadow: var(--glow-amber); border-color: rgba(240,168,48,0.25); }
.page { padding: 16px; animation: fadeIn 0.3s ease-out; }
.page-title { font-size: 22px; font-weight: 700; margin-bottom: 16px; }
.btn {
  padding: 12px 24px; border-radius: var(--radius); font-weight: 600;
  font-size: 15px; transition: all 0.2s; display: inline-flex;
  align-items: center; gap: 8px; justify-content: center;
}
.btn-primary { background: var(--amber); color: #000; }
.btn-primary:hover { background: var(--amber-light); }
.btn-secondary { background: var(--bg3); color: var(--text); }
.btn-secondary:hover { background: var(--bg4); }
.btn-full { width: 100%; }
.btn-sm { padding: 8px 16px; font-size: 13px; }

.study-card {
  background: var(--bg2); border-radius: 20px; min-height: 380px;
  border: 1px solid var(--glass-border); overflow: hidden; position: relative;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.05);
}
.study-card-inner {
  padding: 28px 20px; display: flex; flex-direction: column;
  align-items: center; gap: 14px;
}
.kanji-large { font-size: 80px; font-weight: 900; line-height: 1.2; text-shadow: 0 0 40px rgba(240,168,48,0.2); }
.kanji-medium { font-size: 48px; font-weight: 700; }
.mnemonic-box {
  background: linear-gradient(135deg, rgba(240,168,48,0.08) 0%, rgba(171,71,188,0.06) 100%);
  border: 1px solid rgba(240,168,48,0.15); border-radius: 12px;
  padding: 12px 16px; margin-top: 10px; text-align: right;
}
.mnemonic-box .mnemonic-label { font-size: 11px; color: var(--amber); font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
.mnemonic-box .mnemonic-text { font-size: 13px; color: var(--text2); line-height: 1.5; text-align: start; unicode-bidi: plaintext; }
.tip-card {
  background: linear-gradient(135deg, rgba(66,165,245,0.08) 0%, rgba(171,71,188,0.06) 100%);
  border: 1px solid rgba(66,165,245,0.15); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px; backdrop-filter: blur(10px);
}
.tip-card .tip-icon { font-size: 24px; margin-bottom: 8px; }
.tip-card .tip-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; color: var(--blue); }
.tip-card .tip-text { font-size: 13px; color: var(--text2); line-height: 1.6; }
.tips-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.strategy-card {
  background: var(--bg2); border: 1px solid var(--glass-border); border-radius: var(--radius);
  padding: 16px; backdrop-filter: blur(20px); transition: all 0.3s;
}
.strategy-card:hover { border-color: rgba(240,168,48,0.3); transform: translateY(-2px); }
.reading-text { font-size: 22px; color: var(--amber); }
.meaning-text { font-size: 17px; }
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
}
.rating-btns { display: flex; gap: 8px; padding: 12px 16px; }
.rating-btn {
  flex: 1; padding: 10px 4px; border-radius: 12px; font-size: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 1px solid var(--glass-border); transition: all 0.2s;
  backdrop-filter: blur(10px); background: var(--glass);
}
.rating-btn:hover { transform: translateY(-3px); box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
.rating-btn .interval { font-size: 10px; opacity: 0.7; }

.explorer-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
}
.explorer-cell {
  aspect-ratio: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; border-radius: 12px;
  background: var(--bg2); border: 1px solid var(--glass-border); cursor: pointer;
  transition: all 0.25s; font-size: 26px; padding: 4px 2px; gap: 1px;
  position: relative; overflow: hidden; backdrop-filter: blur(10px);
}
.explorer-cell:hover { border-color: var(--amber); transform: scale(1.05); box-shadow: 0 0 16px rgba(240,168,48,0.15); }
.explorer-cell .cell-reading { font-size: 8px; color: var(--amber); opacity: 0.8; font-family: 'Noto Sans JP', sans-serif; direction: ltr; }
.explorer-cell .cell-sub { font-size: 8px; color: var(--text3); line-height: 1; }
.explorer-cell .cell-stage-dot { position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; }

.quiz-setup { text-align: center; padding: 20px 0; }
.quiz-setup-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
.size-options { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 16px 0; }
.size-option {
  padding: 12px 20px; border-radius: 12px; border: 2px solid var(--bg3);
  background: var(--bg2); cursor: pointer; transition: all 0.2s;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-width: 70px;
}
.size-option:hover { border-color: var(--amber); }
.size-option.selected { border-color: var(--amber); background: rgba(240,168,48,0.15); }
.size-option .size-num { font-size: 22px; font-weight: 700; color: var(--amber); }
.size-option .size-label { font-size: 11px; color: var(--text2); }

.tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.tab {
  padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
  background: var(--bg3); color: var(--text2); transition: all 0.2s;
}
.tab.active { background: var(--amber); color: #000; }

.search-box {
  width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--bg3);
  background: var(--bg2); color: var(--text); font-size: 14px; margin-bottom: 12px;
}
.search-box::placeholder { color: var(--text3); }

.progress-bar { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }

.stat-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
.stat-label { color: var(--text2); font-size: 14px; }
.stat-value { font-weight: 700; font-size: 16px; }

.toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
.toggle-switch {
  width: 44px; height: 24px; border-radius: 12px; background: var(--bg3);
  position: relative; cursor: pointer; transition: background 0.3s;
}
.toggle-switch.on { background: var(--amber); }
.toggle-switch::after {
  content: ''; position: absolute; width: 20px; height: 20px; border-radius: 50%;
  background: white; top: 2px; left: 2px; transition: transform 0.3s;
}
.toggle-switch.on::after { transform: translateX(20px); }

.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px;
  border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer;
  border: 2px solid var(--bg3); transition: all 0.2s;
}
.chip.selected { border-color: var(--amber); background: rgba(240,168,48,0.15); }

.mc-option {
  padding: 14px; border-radius: 10px; border: 2px solid var(--bg3);
  margin-bottom: 8px; cursor: pointer; transition: all 0.2s; font-size: 15px;
  width: 100%; display: block; text-align: right; background: transparent; color: inherit;
}
.mc-option:hover { border-color: var(--amber); }
.mc-option:disabled { cursor: default; opacity: 1; }
.mc-option.correct { border-color: var(--green); background: rgba(76,175,80,0.15); }
.mc-option.wrong { border-color: var(--red); background: rgba(239,83,80,0.15); }

.typing-input {
  width: 100%; padding: 14px; border-radius: 10px; border: 2px solid var(--bg3);
  background: var(--bg); color: var(--text); font-size: 18px; text-align: center;
  direction: ltr;
}
.typing-input:focus { outline: none; border-color: var(--amber); }

.xp-float {
  position: absolute; top: 30%; left: 50%; transform: translateX(-50%);
  font-size: 24px; font-weight: 700; color: var(--amber);
  animation: xpFloat 1.5s ease-out forwards; pointer-events: none; z-index: 10;
}

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  background: var(--bg2); border-radius: 16px; padding: 24px; width: 100%;
  max-width: 400px; max-height: 80vh; overflow-y: auto; border: 1px solid var(--glass-border);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 16px 64px rgba(0,0,0,0.5);
}

.combo-badge {
  position: absolute; top: 12px; right: 12px; background: var(--amber);
  color: #000; padding: 4px 10px; border-radius: 20px; font-size: 12px;
  font-weight: 700;
}

.session-timer {
  position: absolute; top: 12px; left: 12px; color: var(--text3);
  font-size: 12px; font-weight: 600;
}

/* === MEMORY GUIDE === */
.guide-hero {
  position: relative; overflow: hidden; min-height: 176px; padding: 24px 22px;
  border: 1px solid rgba(240,168,48,0.22); border-radius: 22px; margin-bottom: 14px;
  background:
    linear-gradient(145deg, rgba(240,168,48,0.12), rgba(66,165,245,0.05) 58%, transparent),
    var(--bg2);
  box-shadow: var(--glow-amber);
}
.guide-watermark {
  position: absolute; inset-inline-start: -12px; bottom: -30px; font-size: 168px;
  font-weight: 900; line-height: 1; color: rgba(240,168,48,0.07); pointer-events: none;
}
.guide-hero-copy { position: relative; z-index: 1; max-width: 310px; }
.guide-eyebrow { color: var(--amber); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 8px; }
.guide-hero h1 { font-size: 25px; line-height: 1.25; margin-bottom: 8px; }
.guide-hero p { color: var(--text2); font-size: 13px; line-height: 1.65; }
.guide-switch {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px;
  background: var(--bg2); border: 1px solid var(--glass-border); border-radius: 14px; margin-bottom: 14px;
}
.guide-switch button { min-height: 42px; border-radius: 10px; color: var(--text2); font-size: 13px; font-weight: 700; }
.guide-switch button.active { color: #111; background: var(--amber); box-shadow: 0 5px 18px rgba(240,168,48,0.2); }
.method-loop { position: relative; display: grid; gap: 10px; margin-bottom: 16px; }
.method-step {
  display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: start;
  padding: 15px; background: var(--bg2); border: 1px solid var(--glass-border); border-radius: 14px;
}
.method-step-num {
  width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%;
  background: rgba(240,168,48,0.13); color: var(--amber); border: 1px solid rgba(240,168,48,0.3);
  font-family: 'Noto Sans JP', sans-serif; font-size: 13px; font-weight: 900;
}
.method-step h3 { font-size: 15px; margin-bottom: 4px; }
.method-step p { color: var(--text2); font-size: 12px; line-height: 1.65; }
.method-step a { display: inline-block; color: var(--blue); font-size: 11px; margin-top: 7px; text-decoration: none; }
.method-step a:hover { text-decoration: underline; }
.memory-steps { display: grid; gap: 8px; text-align: right; }
.memory-step {
  display: grid; grid-template-columns: 28px 1fr; gap: 9px; align-items: start;
  padding: 10px 11px; border-radius: 10px; background: var(--glass); border: 1px solid var(--glass-border);
}
.memory-step-icon { font-size: 16px; text-align: center; }
.memory-step-label { color: var(--amber); font-size: 11px; font-weight: 700; margin-bottom: 2px; }
.memory-step-text { color: var(--text2); font-size: 12px; line-height: 1.55; unicode-bidi: plaintext; }
.memory-disclaimer { color: var(--text3); font-size: 10px; line-height: 1.45; margin-top: 8px; }
.mistake-coach {
  position: relative; overflow: hidden; border-radius: 16px; padding: 16px;
  background: linear-gradient(145deg, rgba(239,83,80,0.1), rgba(240,168,48,0.06));
  border: 1px solid rgba(239,83,80,0.3); text-align: right;
}
.mistake-coach-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.mistake-stamp {
  width: 48px; height: 48px; flex: 0 0 48px; display: grid; place-items: center;
  color: var(--red); border: 2px solid var(--red); border-radius: 50%; font-size: 13px;
  font-weight: 900; transform: rotate(-7deg); letter-spacing: -0.06em;
}
.mistake-title { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
.mistake-attempt { color: var(--text2); font-size: 12px; line-height: 1.5; }
.guide-toolbar { display: grid; gap: 9px; margin-bottom: 12px; }
.guide-filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
.guide-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.guide-kanji-card {
  min-height: 105px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 10px 6px; border-radius: 14px; background: var(--bg2);
  border: 1px solid var(--glass-border); transition: border-color .2s, transform .2s;
  content-visibility: auto; contain-intrinsic-size: 105px;
}
.guide-kanji-card:hover { border-color: rgba(240,168,48,0.55); transform: translateY(-2px); }
.guide-kanji-char { font-size: 35px; line-height: 1.15; }
.guide-kanji-meaning { color: var(--text2); font-size: 11px; }
.guide-mistake-count { color: var(--red); font-size: 9px; margin-top: 2px; }
.recall-stage {
  padding: 18px; text-align: center; border-radius: 14px;
  background: repeating-linear-gradient(0deg, transparent, transparent 25px, rgba(66,165,245,0.07) 26px), var(--glass);
  border: 1px solid rgba(66,165,245,0.2);
}
.recall-stage .recall-kanji { font-size: 72px; font-weight: 900; line-height: 1.2; }
.source-list { display: grid; gap: 8px; }
.source-link {
  display: flex; gap: 9px; align-items: flex-start; padding: 11px; border-radius: 10px;
  color: var(--text2); background: var(--glass); border: 1px solid var(--glass-border); text-decoration: none;
}
.source-link:hover { color: var(--text); border-color: rgba(66,165,245,0.4); }
.source-link span:first-child { color: var(--blue); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* === MOBILE OPTIMIZATIONS === */
html { touch-action: manipulation; }
* { -webkit-tap-highlight-color: transparent; }
body { overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; min-height: 100dvh; }
body.modal-open { overflow: hidden; position: fixed; width: 100%; }
.nav-btn { min-height: 48px; }
.rating-btn { min-height: 48px; }
.chip { min-height: 44px; padding: 10px 14px; }
.tab { min-height: 44px; padding: 10px 14px; }
.btn:active { transform: scale(0.96); }
.rating-btn:active { transform: scale(0.95); background: var(--bg4); }
.chip:active { transform: scale(0.95); }
.mc-option:active { transform: scale(0.98); background: var(--bg3); }
.explorer-cell:active { transform: scale(0.95); }
.nav-btn:active { opacity: 0.7; }
button, .nav-bar, .chip, .tab, .rating-btn, .mc-option, .explorer-cell, .badge, .toggle-switch {
  user-select: none; -webkit-user-select: none;
}
.search-box { font-size: 16px; }
#root { padding-top: env(safe-area-inset-top, 0px); }
.nav-btn.active { position: relative; }
.nav-btn.active::before {
  content: ''; position: absolute; top: 0; left: 25%; right: 25%;
  height: 2px; background: var(--amber); border-radius: 1px;
}
.modal-overlay { align-items: flex-end; }
.modal { border-radius: 16px 16px 0 0; border-bottom: none; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); animation: slideUp 0.3s ease-out; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.study-card { contain: layout style; }
@media (orientation: landscape) and (max-height: 500px) {
  .study-card { min-height: 260px; }
  .kanji-large { font-size: 56px; }
  .page { padding: 8px 16px; }
}

.heatmap-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; }
.heatmap-cell { aspect-ratio: 1; border-radius: 3px; position: relative; }
.heatmap-cell:hover .heatmap-tooltip { display: block; }
.heatmap-tooltip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--bg2); border: 1px solid var(--bg3); border-radius: 6px; padding: 4px 8px; font-size: 10px; white-space: nowrap; z-index: 10; }
.forecast-bar { display: flex; gap: 4px; margin-top: 8px; }
.forecast-item { flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--bg3); }

  {label:'קל', labelEn:'Easy', hours:0, delta:2},
];

function getStage(level) {
  return SRS_STAGES.find(s => level >= s.min && level <= s.max) || SRS_STAGES[0];
}

function getIntervalText(stage, delta) {
  const newLevel = Math.max(0, stage + delta);
  if (newLevel <= 0) return '4 דק\'';
  if (newLevel === 1) return '4 שעות';
  if (newLevel === 2) return '8 שעות';
  if (newLevel === 3) return '1 יום';
  if (newLevel === 4) return '2 ימים';
  if (newLevel === 5) return '1 שבוע';
  if (newLevel === 6) return '2 שבועות';
  if (newLevel === 7) return '1 חודש';
  if (newLevel === 8) return '4 חודשים';
  return 'נצרב ✓';
}

function getLearningProfile(kanji) {
  return kanji ? KANJI_LEARNING[kanji.c] : null;
}

function getComponentHint(kanji) {
  const profile = getLearningProfile(kanji);
  if (profile && profile.parts) {
    return profile.parts.map(part => part.g ? `${part.g} (${part.he})` : part.he).join(' + ');
  }
  return kanji.p || COMPONENT_HINTS[kanji.c] ||
    `חפשו בתוך ${kanji.c} רכיב, מסגרת או כיוון קווים שכבר מוכרים לכם.`;
}

function getMemoryStory(kanji) {
  const profile = getLearningProfile(kanji);
  if (profile && profile.scene) return profile.scene;
  if (kanji.m && /[\u0590-\u05ff]/.test(kanji.m)) return kanji.m;
  return `דמיינו את הצורה ${kanji.c} בתוך סצנה קצרה שמסתיימת במשמעות „${kanji.he}”. ככל שהתמונה מוגזמת יותר, קל יותר לשלוף אותה.`;
}

function formatLevel(level) {
  return level === 'N5' ? 'N5 + יסודות' : level;

function needsStrengthening(progress) {
  if (!progress) return false;
  if (typeof progress.needsReview === 'boolean') return progress.needsReview;
  return progress.lastResult === 'wrong';
}

// ======================== AUDIO ========================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playSound(type) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'flip') { osc.frequency.value = 600; gain.gain.value = 0.08; osc.type = 'sine'; }
    else if (type === 'correct') { osc.frequency.value = 800; gain.gain.value = 0.1; osc.type = 'sine'; }
    else if (type === 'wrong') { osc.frequency.value = 300; gain.gain.value = 0.1; osc.type = 'sawtooth'; }
    else if (type === 'levelup') { osc.frequency.value = 1000; gain.gain.value = 0.08; osc.type = 'sine'; }
    else { osc.frequency.value = 500; gain.gain.value = 0.06; osc.type = 'sine'; }
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

// --- Japanese TTS ---
// Voice loaded eagerly at startup; never touched inside a click handler
let _jpVoice = null;

function _loadVoice() {
  if (!window.speechSynthesis) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;
  const jp = voices.filter(v => /^ja/.test(v.lang));
  if (!jp.length) return;
  const skip = /eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley/i;
  _jpVoice = jp.find(v => /premium|enhanced/i.test(v.name))
           || jp.find(v => v.localService && !skip.test(v.name))
           || jp.find(v => v.localService)
           || jp[0];
}
if (window.speechSynthesis) {
  _loadVoice();
  window.speechSynthesis.onvoiceschanged = _loadVoice;
}

function speakJP(text) {
  if (!text) return;
  const clean = text.replace(/[\s\n\r]+/g, '');
  if (!clean) return;
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'ja-JP';
  if (_jpVoice) u.voice = _jpVoice;
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

function haptic(style = 'light') {
  if (navigator.vibrate) {
    if (style === 'light') navigator.vibrate(10);
    else if (style === 'medium') navigator.vibrate(20);
    else navigator.vibrate([30, 10, 30]);
  }
}

// ======================== STORAGE ========================
function loadData(key, def) {
  try { const d = localStorage.getItem('kanji_' + key); return d ? JSON.parse(d) : def; } catch { return def; }
}
function saveData(key, val) {
  try { localStorage.setItem('kanji_' + key, JSON.stringify(val)); } catch {}
}

// ======================== MAIN APP ========================
function App() {
  const [tab, setTab] = useState('home');
  const [theme, setTheme] = useState(() => loadData('theme', 'light'));
  const [soundOn, setSoundOn] = useState(() => loadData('sound', true));
  const [selectedLevels, setSelectedLevels] = useState(() => loadData('levels', ['N5']));
  const [quizMode, setQuizMode] = useState(() => loadData('quizMode', 'flashcard'));
  const [srsData, setSrsData] = useState(() => loadData('srs', {}));
  const [stats, setStats] = useState(() => loadData('stats', {totalReviews:0, totalXP:0, streak:0, lastDate:null, dailyDone:0, dailyGoal:20, history:{}}));
  const [sessionTime, setSessionTime] = useState(0);
  const [sessionActive, setSessionActive] = useState(false);
  const [lastAction, setLastAction] = useState(null);
  const [lessonFocus, setLessonFocus] = useState(null);

  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); saveData('theme', theme); }, [theme]);
  useEffect(() => { saveData('sound', soundOn); }, [soundOn]);
  useEffect(() => { saveData('levels', selectedLevels); }, [selectedLevels]);
  useEffect(() => { saveData('quizMode', quizMode); }, [quizMode]);
  useEffect(() => { saveData('srs', srsData); }, [srsData]);
  useEffect(() => { saveData('stats', stats); }, [stats]);

  // Session timer
  useEffect(() => {
    let iv;
    if (sessionActive) {
      iv = setInterval(() => setSessionTime(t => t + 1), 1000);
    }
    return () => clearInterval(iv);
  }, [sessionActive]);

  // Check daily streak
  useEffect(() => {
    const today = new Date().toDateString();
    if (stats.lastDate && stats.lastDate !== today) {
      const last = new Date(stats.lastDate);
      const diff = Math.floor((new Date(today) - last) / 86400000);
      if (diff > 1) {
        setStats(s => ({...s, streak: 0, dailyDone: 0, lastDate: today}));
      } else {
        setStats(s => ({...s, dailyDone: 0}));
      }
    }
  }, []);

  const filteredKanji = useMemo(() =>
    KANJI.filter(k => selectedLevels.includes(k.j)),
    [selectedLevels]
  );

  const toggleLevel = (lv) => {
    setSelectedLevels(prev =>
      prev.includes(lv) ? (prev.length > 1 ? prev.filter(l => l !== lv) : prev) : [...prev, lv]
    );
  };

  const doSound = (type) => { if (soundOn) playSound(type); };

  return (
    <div>
      <TopBar theme={theme} setTheme={setTheme} soundOn={soundOn} setSoundOn={setSoundOn}
              sessionTime={sessionTime} sessionActive={sessionActive} stats={stats} setTab={setTab} />
      {tab === 'home' && <HomePage stats={stats} filteredKanji={filteredKanji} srsData={srsData}
                                    selectedLevels={selectedLevels} toggleLevel={toggleLevel} setTab={setTab}
                                    setLessonFocus={setLessonFocus} />}
      {tab === 'study' && <StudyPage kanji={filteredKanji} srsData={srsData} setSrsData={setSrsData}
                                      stats={stats} setStats={setStats} quizMode={quizMode} setQuizMode={setQuizMode}
                                      doSound={doSound} sessionActive={sessionActive} setSessionActive={setSessionActive}
                                      setSessionTime={setSessionTime} lastAction={lastAction} setLastAction={setLastAction}
                                      lessonFocus={lessonFocus} setLessonFocus={setLessonFocus} setTab={setTab} />}
      {tab === 'explore' && <ExplorePage selectedLevels={selectedLevels} srsData={srsData} />}
      {tab === 'tips' && <TipsPage srsData={srsData} />}
      {tab === 'add' && <AddPage selectedLevels={selectedLevels} toggleLevel={toggleLevel}
                                  stats={stats} setStats={setStats} quizMode={quizMode} setQuizMode={setQuizMode} />}
      {tab === 'stats' && <StatsPage stats={stats} srsData={srsData} />}
      {!(tab === 'study' && sessionActive) && <NavBar tab={tab} setTab={(t) => {
        if (t !== 'study') { setSessionActive(false); setSessionTime(0); }
        if (t === 'study') setLessonFocus(null);
        setTab(t);
      }} />}
    </div>
  );
}

// ======================== PROGRESS RING ========================
function ProgressRing({progress, size=80, stroke=6}) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - Math.min(progress, 1) * circ;
  return (
    <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--bg3)" strokeWidth={stroke} />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--amber)" strokeWidth={stroke}
              strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
              style={{transition:'stroke-dashoffset 0.5s ease'}} />
      <text x={size/2} y={size/2} textAnchor="middle" dominantBaseline="central" fill="var(--text)"
            fontSize={size*0.22} fontWeight="700" style={{transform:'rotate(90deg)', transformOrigin:'center'}}>
        {Math.round(progress * 100)}%
      </text>
    </svg>
  );
}

          </div>
        )}
        <div className="daily-goal-row">
          <div className="daily-progress-copy">
            <strong>{stats.dailyDone} מתוך {stats.dailyGoal}</strong>
            <span>צעדים ביעד היומי</span>
          </div>
          <div className="daily-track" aria-label={`${Math.round(progress * 100)} אחוז מהיעד היומי`}>
            <span style={{width:`${progress * 100}%`}} />
          </div>
        </div>
        <button className="btn btn-primary btn-full hero-cta" onClick={() => openUnit(currentUnit)}>
          <span>התחילו את {currentUnit.label}</span><span aria-hidden="true">←</span>
        </button>
      </section>

      <section className={`daily-review ${learnedDue.length ? 'has-reviews' : 'all-clear'}`}>
        <div className="review-icon" aria-hidden="true">{learnedDue.length ? '↻' : '✓'}</div>
        <div className="review-copy">
          <strong>{learnedDue.length ? `${learnedDue.length} קאנג׳י מחכים לחזרה` : 'החזרות מסודרות להיום'}</strong>
          <span>{learnedDue.length ? 'תרגול קצר שמבוסס על מה שכבר למדתם' : `${unseenCount} חדשים מחכים לאורך המסלול`}</span>
        </div>
        <button className="review-action" disabled={!learnedDue.length} onClick={() => { setLessonFocus(null); setTab('study'); }}>
          {learnedDue.length ? 'לתרגל' : 'מעולה'}
        </button>
      </section>

      <section className="path-section" aria-labelledby="path-title">
        <div className="section-heading">
          <div><span className="section-kicker">מסלול מתחילים</span><h2 id="path-title" className="display-font">שביל הדיו</h2></div>
          <button onClick={() => setTab('tips')}>איך לומדים? ←</button>
        </div>
        <div className="lesson-path">
          {unitProgress.map((unit, index) => {
            const status = unit.learned === unit.chars.length ? 'completed' : index === currentIndex ? 'current' : 'upcoming';
            return (
              <button key={unit.id} className={`path-unit ${status}`} style={{'--unit-color':unit.color}}
                      onClick={() => openUnit(unit)} aria-label={`${unit.label}: ${unit.title}, ${unit.learned} מתוך ${unit.chars.length} נלמדו`}>
                <span className="path-node">
                  <span className="jp node-kanji">{status === 'completed' ? '✓' : unit.icon}</span>
                  {status === 'current' && <span className="node-play" aria-hidden="true">▶</span>}
                </span>
                <span className="path-copy">
                  <small>{unit.label}</small>
                  <strong>{unit.title}</strong>
                  <span>{unit.subtitle}</span>
                  <span className="unit-meter"><i style={{width:`${(unit.learned / unit.chars.length) * 100}%`}} /></span>
                  <em>{unit.learned}/{unit.chars.length} נלמדו</em>
                </span>
              </button>
            );
          })}
        </div>
      </section>

      <details className="level-panel">
        <summary>רמות נוספות לתרגול</summary>
        <div className="level-panel-content">
          <p>המסלול המודרך מתחיל ביסודות. התרגול החופשי יכול לערבב גם רמות מתקדמות.</p>
          <div className="level-chips">
            {['N5','N4','N3','N2','N1'].map(lv => (
              <button key={lv} className={`chip ${selectedLevels.includes(lv) ? 'selected' : ''}`}
                      onClick={() => toggleLevel(lv)}>{formatLevel(lv)}</button>
            ))}
          </div>
        </div>
      </details>

      <aside className="kitsu-tip">
        <span aria-hidden="true">💡</span>
        <div><strong>טיפ קטן מקיצו</strong><p>{DAILY_QUICK_TIPS[Math.floor(Date.now() / 86400000) % DAILY_QUICK_TIPS.length]}</p></div>
      </aside>
    </main>
  );
}

// ======================== STUDY PAGE ========================
function StudyPage({kanji, srsData, setSrsData, stats, setStats, quizMode, setQuizMode, doSound, sessionActive, setSessionActive, setSessionTime, lastAction, setLastAction, lessonFocus, setLessonFocus, setTab}) {
  const [phase, setPhase] = useState('setup'); // 'setup' | 'active' | 'done'
  const [quizSize, setQuizSize] = useState(() => loadData('quizSize', 20));
  const [studyFilter, setStudyFilter] = useState('due'); // 'due' | 'new' | 'weak' | 'all'
  const [currentIndex, setCurrentIndex] = useState(0);
  const [sessionDeck, setSessionDeck] = useState([]);
  const [flipped, setFlipped] = useState(false);
  const [combo, setCombo] = useState(0);
  const [xpFloat, setXpFloat] = useState(null);
  const [mcOptions, setMcOptions] = useState([]);
  const [mcAnswer, setMcAnswer] = useState(null);
  const [typingVal, setTypingVal] = useState('');
  const [typingResult, setTypingResult] = useState(null);
  const [pendingRating, setPendingRating] = useState(null);
  const [mistakeAttempt, setMistakeAttempt] = useState('');
  const [sessionStats, setSessionStats] = useState({correct:0, wrong:0, xp:0});
  const [focusPoints, setFocusPoints] = useState(5);
  const inputRef = useRef(null);
  const advanceTimerRef = useRef(null);
  const finishTimerRef = useRef(null);
  const xpTimerRef = useRef(null);
  const committingRef = useRef(false);
  const pendingRetryRef = useRef(false);
  const retryCharsRef = useRef(new Set());
  const doSoundRef = useRef(doSound);

  const allDue = useMemo(() => {
    const now = new Date();
    return kanji.filter(k => {
      const d = srsData[k.c];
      if (!d || !d.level) return false;
      return !d.nextReview || new Date(d.nextReview) <= now;
    });
  }, [kanji, srsData]);

  const lessonPool = useMemo(() => {
    if (!lessonFocus) return null;
    return lessonFocus.chars.map(char => KANJI.find(k => k.c === char)).filter(Boolean);
  }, [lessonFocus]);

  const newKanji = useMemo(() => kanji.filter(k => !srsData[k.c] || srsData[k.c].level === 0), [kanji, srsData]);
  const weakKanji = useMemo(() => kanji.filter(k => {
    const d = srsData[k.c];
    return d && d.level >= 1 && d.level <= 3;
  }), [kanji, srsData]);

  const dueKanji = useMemo(() => {
    if (lessonPool) return lessonPool;
    let pool;
    if (studyFilter === 'new') pool = newKanji;
    else if (studyFilter === 'weak') pool = weakKanji;
    else if (studyFilter === 'all') pool = kanji;
    else pool = allDue;
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    return quizSize === 0 ? shuffled : shuffled.slice(0, quizSize);
  }, [lessonPool, studyFilter, quizSize, allDue, newKanji, weakKanji, kanji]);

  const current = phase === 'active' ? sessionDeck[currentIndex] : null;

  // === ALL HOOKS MUST BE ABOVE ALL RETURNS ===

  // Start session timer
  useEffect(() => {
    if (phase === 'active' && !sessionActive && sessionDeck.length > 0) setSessionActive(true);
  }, [phase, sessionActive, sessionDeck.length, setSessionActive]);

  useEffect(() => { doSoundRef.current = doSound; }, [doSound]);

  useEffect(() => () => {
    [advanceTimerRef, finishTimerRef, xpTimerRef].forEach(ref => {
      if (ref.current) clearTimeout(ref.current);
    });
  }, []);

  // Generate MC options
  useEffect(() => {
    if (quizMode === 'mc' && current) {
      const correct = current;
      const others = kanji.filter(k => k.c !== correct.c).sort(() => Math.random() - 0.5).slice(0, 3);
      const opts = [correct, ...others].sort(() => Math.random() - 0.5);
      setMcOptions(opts);
      setMcAnswer(null);
    }
    if (quizMode === 'typing') {
      setTypingVal('');
      setTypingResult(null);
    }
    setPendingRating(null);
    setMistakeAttempt('');
    committingRef.current = false;
    pendingRetryRef.current = false;
    if (advanceTimerRef.current) {
      clearTimeout(advanceTimerRef.current);
      advanceTimerRef.current = null;
    }
  }, [currentIndex, quizMode, current?.c]);

  // Keyboard shortcuts - use ref to avoid dependency on handleRate
  const handleRateRef = useRef(null);
  const advanceCardRef = useRef(null);
  useEffect(() => {
    const handler = (e) => {
      if (['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName) || e.target.isContentEditable) return;
      if (e.code === 'Space') {
        e.preventDefault();
        setFlipped(prev => { if (!prev) { doSoundRef.current('flip'); return true; } return prev; });
      }
      if (['Digit1','Digit2','Digit3','Digit4'].includes(e.code)) {
        const idx = parseInt(e.code.replace('Digit','')) - 1;
        if (idx >= 0 && idx < 4 && handleRateRef.current) handleRateRef.current(idx);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  // === END HOOKS === Now safe to have conditional returns ===

  // Setup screen
  if (phase === 'setup') {
    const sizes = [
      {n: 5, l: 'מהיר'},
      {n: 10, l: 'קצר'},
      {n: 20, l: 'רגיל'},
      {n: 30, l: 'ארוך'},
      {n: 50, l: 'מרתון'},
      {n: 0, l: 'הכל'},
    ];
    const filters = [
      {k:'due', l:'ממתינים', count: allDue.length, icon:'⏰'},
      {k:'new', l:'חדשים', count: newKanji.length, icon:'🆕'},
      {k:'weak', l:'חלשים', count: weakKanji.length, icon:'💪'},
      {k:'all', l:'הכל', count: kanji.length, icon:'📚'},
    ];
    const effectiveCount = lessonPool ? lessonPool.length : studyFilter === 'new' ? newKanji.length :
                           studyFilter === 'weak' ? weakKanji.length :
                           studyFilter === 'all' ? kanji.length : allDue.length;
    const actualSize = lessonPool ? lessonPool.length : quizSize === 0 ? effectiveCount : Math.min(quizSize, effectiveCount);
    return (
      <div className="page quiz-setup">
        {lessonFocus ? (
          <section className="lesson-setup-hero" style={{'--unit-color':lessonFocus.color}}>
            <button className="lesson-setup-close" onClick={() => { setLessonFocus(null); setTab('home'); }} aria-label="חזרה למסלול">×</button>
            <KitsuMascot size={76} />
            <span className="section-kicker">{lessonFocus.label}</span>
            <h1 className="display-font">{lessonFocus.title}</h1>
            <p>{lessonFocus.coach}</p>
            <div className="lesson-char-preview" dir="ltr">
              {lessonPool.map(k => <span className="jp" key={k.c}>{k.c}</span>)}
            </div>
          </section>
        ) : (
          <div className="quiz-setup-title display-font">בחרו תרגול</div>
        )}

        {!lessonFocus && (
          <div className="card setup-card" style={{textAlign:'right'}}>
            <div style={{fontWeight:700, marginBottom:10}}>מה לתרגל?</div>
            <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
              {filters.map(f => (
                <button key={f.k} className={`chip ${studyFilter === f.k ? 'selected' : ''}`}
                        onClick={() => setStudyFilter(f.k)}>
                  {f.icon} {f.l} ({f.count})
                </button>
              ))}
            </div>
          </div>
        )}

        {!lessonFocus && (
          <div className="card setup-card" style={{textAlign:'right'}}>
            <div style={{fontWeight:700, marginBottom:10}}>כמה קאנג׳י?</div>
            <div className="size-options">
              {sizes.map(s => (
                <button key={s.n} className={`size-option ${quizSize === s.n ? 'selected' : ''}`}
                        onClick={() => { setQuizSize(s.n); saveData('quizSize', s.n); }}>
                  <span className="size-num">{s.n === 0 ? '∞' : s.n}</span>
                  <span className="size-label">{s.l}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        <div className="card setup-card" style={{textAlign:'right'}}>
          <div style={{fontWeight:700, marginBottom:10}}>{lessonFocus ? 'איך נתרגל את היחידה?' : 'מצב תרגול'}</div>
          <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
            {[{k:'flashcard',l:'🃏 כרטיסיות'},{k:'mc',l:'📝 רב-ברירה'},{k:'typing',l:'⌨️ הקלדה'}].map(m => (
              <button key={m.k} className={`chip ${quizMode === m.k ? 'selected' : ''}`}
                      onClick={() => { setQuizMode(m.k); saveData('quizMode', m.k); }}>{m.l}</button>
            ))}
          </div>
        </div>

        <div className="session-count-card">
          <div>{actualSize}</div>
          <span>קאנג׳י בשיעור הזה · כחמש דקות</span>
        </div>

        <button className="btn btn-primary btn-full" style={{fontSize:18, padding:16, marginTop:16}}
                disabled={actualSize === 0}
                onClick={() => {
                  [advanceTimerRef, finishTimerRef, xpTimerRef].forEach(ref => {
                    if (ref.current) clearTimeout(ref.current);
                    ref.current = null;
                  });
                  retryCharsRef.current = new Set();
                  pendingRetryRef.current = false;
                  committingRef.current = false;
                  setSessionDeck(dueKanji);
                  setCurrentIndex(0);
                  setCombo(0);
                  setXpFloat(null);
                  setPendingRating(null);
                  setMistakeAttempt('');
                  setSessionStats({correct:0,wrong:0,xp:0});
                  setFocusPoints(5);
                  setLastAction(null);
                  setSessionTime(0);
                  setPhase('active');
                }}>
          {lessonFocus ? `מתחילים את ${lessonFocus.label}` : 'מתחילים לתרגל'}
        </button>
      </div>
    );
  }

  // Done screen
  if (phase === 'done') {
    const total = sessionStats.correct + sessionStats.wrong;
    const accuracy = total > 0 ? Math.round((sessionStats.correct / total) * 100) : 0;
    return (
      <div className="page lesson-done">
        <KitsuMascot size={104} />
        <div className="done-confetti" aria-hidden="true">✦　●　✦</div>
        <h1 className="display-font">{lessonFocus ? `${lessonFocus.label} הושלמה!` : 'תרגול מעולה!'}</h1>
        <p>{accuracy >= 80 ? 'הקווים כבר מתחילים להרגיש כמו סיפור.' : 'כל טעות הפכה עכשיו לרמז שאפשר לזכור.'}</p>
        <div className="card done-score-card" style={{textAlign:'center'}}>
          <div style={{display:'flex', justifyContent:'space-around', marginBottom:16}}>
            <div><div style={{fontSize:28, fontWeight:700, color:'var(--green)'}}>{sessionStats.correct}</div><div style={{fontSize:12, color:'var(--text2)'}}>נכון</div></div>
            <div><div style={{fontSize:28, fontWeight:700, color:'var(--red)'}}>{sessionStats.wrong}</div><div style={{fontSize:12, color:'var(--text2)'}}>לחיזוק</div></div>
            <div><div style={{fontSize:28, fontWeight:700, color:'var(--amber)'}}>{sessionStats.xp}</div><div style={{fontSize:12, color:'var(--text2)'}}>XP</div></div>
          </div>
          <div className="progress-bar" style={{height:8, marginBottom:8}}>
            <div className="progress-fill" style={{width:`${accuracy}%`, background: accuracy >= 80 ? 'var(--green)' : accuracy >= 50 ? 'var(--orange)' : 'var(--red)'}} />
          </div>
          <div style={{fontSize:14, color:'var(--text2)'}}>{accuracy}% דיוק</div>
        </div>
        <div className="done-actions">
          <button className="btn btn-primary btn-full" onClick={() => { setLessonFocus(null); setTab('home'); }}>חזרה למסלול</button>
          <button className="btn btn-secondary btn-full" onClick={() => setPhase('setup')}>תרגול נוסף</button>
        </div>
      </div>
    );
  }

  const applyRating = (ratingIdx) => {
    if (!current || committingRef.current) return;
    committingRef.current = true;
    const rating = INTERVALS[ratingIdx];
    const prev = srsData[current.c] || {level: 0, reviews: 0};
    const newLevel = Math.max(0, Math.min(9, prev.level + rating.delta));
    const isGood = ratingIdx >= 2;
    const isAnswerMistake = quizMode !== 'flashcard' && ratingIdx < 2;
    const needsReview = ratingIdx < 2;
    const reviewedAt = new Date().toISOString();
    pendingRetryRef.current = needsReview;

    // Calculate next review
    let hours;
    if (newLevel <= 0) hours = 0.07;
    else if (newLevel === 1) hours = 4;
    else if (newLevel === 2) hours = 8;
    else if (newLevel === 3) hours = 24;
    else if (newLevel === 4) hours = 48;
    else if (newLevel === 5) hours = 168;
    else if (newLevel === 6) hours = 336;
    else if (newLevel === 7) hours = 720;
    else if (newLevel === 8) hours = 2880;
    else hours = 999999;

    const nextReview = new Date(Date.now() + hours * 3600000).toISOString();

    // Save undo
    setLastAction({
      char: current.c,
      prevSrs: prev,
      prevStats: {...stats},
      prevSessionStats: {...sessionStats},
      prevCombo: combo,
      prevFocus: focusPoints,
      index: currentIndex,
      advanced: false,
      retryAdded: false,
    });

    // Combo & XP
    const newCombo = isGood ? combo + 1 : 0;
    const multiplier = Math.min(1 + Math.floor(newCombo / 3) * 0.5, 3);
    const baseXP = ratingIdx === 3 ? 15 : ratingIdx === 2 ? 10 : ratingIdx === 1 ? 5 : 2;
    const earnedXP = Math.round(baseXP * multiplier);

    if (isGood) doSoundRef.current('correct');
    else doSoundRef.current('wrong');
    if (newLevel > prev.level && newLevel >= 5) doSoundRef.current('levelup');

    setCombo(newCombo);
    if (!isGood) setFocusPoints(value => Math.max(0, value - 1));
    setXpFloat(earnedXP);
    if (xpTimerRef.current) clearTimeout(xpTimerRef.current);
    xpTimerRef.current = setTimeout(() => setXpFloat(null), 1500);

    setSrsData(d => ({
      ...d,
      [current.c]: {
        ...prev,
        level: newLevel,
        reviews: (prev.reviews || 0) + 1,
        correct: (prev.correct || 0) + (isGood ? 1 : 0),
        wrong: (prev.wrong || 0) + (isAnswerMistake ? 1 : 0),
        hard: (prev.hard || 0) + (quizMode === 'flashcard' && ratingIdx === 1 ? 1 : 0),
        needsReview,
        lastResult: isGood ? 'correct' : (isAnswerMistake ? 'wrong' : (ratingIdx === 0 ? 'again' : 'hard')),
        lastError: isAnswerMistake ? reviewedAt : prev.lastError,
        nextReview,
        lastReview: reviewedAt,
      }
    }));

    const today = new Date().toDateString();
    setStats(s => ({
      ...s,
      totalReviews: s.totalReviews + 1,
      totalXP: s.totalXP + earnedXP,
      dailyDone: s.dailyDone + 1,
      lastDate: today,
      streak: s.lastDate === today ? s.streak : (s.streak + 1),
    }));

    // Track session
    setSessionStats(ss => ({
      ...ss,
      correct: isGood ? ss.correct + 1 : ss.correct,
      wrong: !isGood ? ss.wrong + 1 : ss.wrong,
      xp: ss.xp + earnedXP,
    }));
  };

  const advanceCard = () => {
    if (!current || !committingRef.current) return;
    let retryAdded = false;
    if (pendingRetryRef.current && !retryCharsRef.current.has(current.c)) {
      retryCharsRef.current.add(current.c);
      setSessionDeck(deck => [...deck, current]);
      retryAdded = true;
    }
    setLastAction(action => action && action.char === current.c
      ? {...action, retryAdded: action.retryAdded || retryAdded, advanced:true}
      : action);
    pendingRetryRef.current = false;
    committingRef.current = false;
    setFlipped(false);
    setPendingRating(null);
    setMistakeAttempt('');
    if (currentIndex < sessionDeck.length - 1 || retryAdded) {
      setCurrentIndex(i => i + 1);
    } else {
      finishTimerRef.current = setTimeout(() => {
        setPhase('done');
        setSessionActive(false);
      }, 300);
    }
  };

  const requestRate = (ratingIdx) => {
    if (!current || quizMode !== 'flashcard' || !flipped || pendingRating !== null) return;
    if (ratingIdx < 2) {
      setPendingRating(ratingIdx);
      setMistakeAttempt(ratingIdx === 0
        ? 'סימנת „שוב” — נבנה רמז קצר והקאנג׳י יחזור בסוף הסשן.'
        : 'סימנת „קשה” — נחזק עכשיו את הצורה, הסיפור והמילה.');
      applyRating(ratingIdx);
      return;
    }
    applyRating(ratingIdx);
    advanceCard();
  };

  const handleMCSelect = (k) => {
    if (mcAnswer) return;
    setMcAnswer(k.c);
    const isCorrect = k.c === current.c;
    if (isCorrect) {
      applyRating(2);
      advanceTimerRef.current = setTimeout(() => advanceCardRef.current && advanceCardRef.current(), 650);
    } else {
      setPendingRating(0);
      setMistakeAttempt(`בחרת „${k.he}”. התשובה ל־${current.c} היא „${current.he}”.`);
      applyRating(0);
    }
  };

  const handleTypingSubmit = (e) => {
    e.preventDefault();
    if (!current || typingResult !== null) return;
    const val = typingVal.trim().toLowerCase();
    const correct = current.en.toLowerCase();
    const isCorrect = val === correct || current.he === val;
    setTypingResult(isCorrect);
    if (isCorrect) {
      applyRating(2);
      advanceTimerRef.current = setTimeout(() => advanceCardRef.current && advanceCardRef.current(), 650);
    } else {
      setPendingRating(0);
      setMistakeAttempt(`כתבת „${typingVal.trim() || '—'}”. התשובה היא ${current.en} (${current.he}).`);
      applyRating(0);
    }
  };

  const handleUndo = () => {
    if (!lastAction) return;
    [advanceTimerRef, finishTimerRef, xpTimerRef].forEach(ref => {
      if (ref.current) clearTimeout(ref.current);
      ref.current = null;
    });
    setSrsData(d => {
      const nd = {...d};
      if (lastAction.prevSrs.level === 0 && !lastAction.prevSrs.reviews) {
        delete nd[lastAction.char];
      } else {
        nd[lastAction.char] = lastAction.prevSrs;
      }
      return nd;
    });
    if (lastAction.retryAdded) {
      setSessionDeck(deck => {
        const retryIndex = deck.map(k => k.c).lastIndexOf(lastAction.char);
        if (retryIndex <= lastAction.index) return deck;
        const nextDeck = [...deck];
        nextDeck.splice(retryIndex, 1);
        return nextDeck;
      });
      retryCharsRef.current.delete(lastAction.char);
    }
    setStats(lastAction.prevStats);
    if (lastAction.prevSessionStats) setSessionStats(lastAction.prevSessionStats);
    setCombo(lastAction.prevCombo || 0);
    setFocusPoints(lastAction.prevFocus ?? 5);
    setXpFloat(null);
    setCurrentIndex(lastAction.index ?? Math.max(0, currentIndex - 1));
    setFlipped(false);
    setMcAnswer(null);
    setTypingResult(null);
    setTypingVal('');
    setPendingRating(null);
    setMistakeAttempt('');
    pendingRetryRef.current = false;
    committingRef.current = false;
    setLastAction(null);
  };

  // Update ref for keyboard shortcuts
  handleRateRef.current = requestRate;
  advanceCardRef.current = advanceCard;

  if (phase === 'active' && (!current || currentIndex >= sessionDeck.length)) {
    return (
      <div className="page" style={{textAlign:'center', paddingTop:60}}>
        <div style={{fontSize:64, marginBottom:20}}>✅</div>
        <div style={{fontSize:22, fontWeight:700, marginBottom:8}}>אין קאנג'י זמינים!</div>
        <div style={{color:'var(--text2)', marginBottom:20}}>שנה את הסינון או חזור מאוחר יותר.</div>
        <button className="btn btn-primary" onClick={() => setPhase('setup')}>חזור להגדרות</button>
      </div>
    );
  }

  const curSrs = srsData[current.c] || {level:0};
  const stage = getStage(curSrs.level);

  return (
    <div className="page">
      {/* Top bar with back, progress, undo */}
      <div className="study-session-head">
        <button onClick={() => {
                  [advanceTimerRef, finishTimerRef, xpTimerRef].forEach(ref => {
                    if (ref.current) clearTimeout(ref.current);
                    ref.current = null;
                  });
                  pendingRetryRef.current = false;
                  committingRef.current = false;
                  setLastAction(null);
                  setPhase('setup');
                  setSessionActive(false);
                }}
                className="lesson-exit" aria-label="יציאה מהשיעור">
          ×
        </button>
        <div className="study-head-center">
          <span dir="ltr">{currentIndex + 1} / {sessionDeck.length}</span>
          <div className="focus-hearts" aria-label={`${focusPoints} נקודות ריכוז מתוך 5`}>
            {[0,1,2,3,4].map(index => <span key={index} className={index < focusPoints ? 'full' : 'empty'}>♥</span>)}
          </div>
        </div>
        <div className="study-head-actions">
          {combo > 2 && <span style={{fontSize:12, color:'var(--amber)', fontWeight:700}}>x{combo}</span>}
          {lastAction && <button onClick={handleUndo} style={{color:'var(--amber)', fontSize:12, fontWeight:600}}>↩ בטל</button>}
        </div>
      </div>
      <div className="progress-bar" style={{marginBottom:12}}>
        <div className="progress-fill" style={{width:`${(currentIndex/sessionDeck.length)*100}%`, background:lessonFocus ? lessonFocus.color : 'var(--amber)'}} />
      </div>

      {/* Card */}
      <div className="study-card">
        {combo > 2 && <div className="combo-badge" style={{animation:'streak 0.5s ease'}}>x{combo} קומבו</div>}
        {xpFloat && <div className="xp-float">+{xpFloat} XP</div>}
        <div className="study-card-inner">
          <div className="badge" style={{background:stage.color+'33', color:stage.color}}>{stage.name}</div>
          <div className="jp kanji-large" onClick={() => speakJP(current.c)}
               style={{cursor:'pointer'}} title="לחץ להשמעה">{current.c}</div>
          <button className="speaker-btn" onClick={() => speakJP(current.c)} title="השמע">🔊</button>
          <div style={{fontSize:12, color:'var(--text3)'}}>משיכות: {current.s} | {formatLevel(current.j)}</div>

          {quizMode === 'flashcard' && !flipped && (
            <button className="btn btn-primary" onClick={() => { setFlipped(true); doSound('flip'); }}
                    style={{marginTop:20}}>
              הפוך (רווח)
            </button>
          )}

          {quizMode === 'flashcard' && flipped && (
            <div className="flip-in" style={{width:'100%', textAlign:'center'}}>
              <div className="meaning-text" style={{marginBottom:6}}>{current.he}</div>
              <div className="meaning-text ltr" style={{color:'var(--text2)', marginBottom:6}}>{current.en}</div>
              <div className="ltr" style={{marginBottom:4}}>
                {current.on.length > 0 && <span className="jp" style={{color:'var(--amber)'}}>音: {current.on.join('、')}</span>}
              </div>
              <div className="ltr" style={{marginBottom:8}}>
                {current.kun.length > 0 && <span className="jp" style={{color:'var(--green)'}}>訓: {current.kun.join('、')}</span>}
              </div>
              {current.v && current.v[0] && (
                <div style={{background:'var(--bg3)', borderRadius:8, padding:10, marginTop:8, cursor:'pointer'}}
                     onClick={() => speakJP(current.v[0].w)}>
                  <div className="jp ltr" style={{fontSize:18}}>{current.v[0].w} 🔊</div>
                  <div className="jp ltr" style={{fontSize:14, color:'var(--amber)'}}>{current.v[0].r}</div>
                  <div style={{fontSize:13}}>{current.v[0].he}</div>
                </div>
              )}
              <div className="answer-learning-card">
                <KanjiEquation kanji={current} compact />
                <div className="mnemonic-box" style={{width:'100%'}}>
                  <div className="mnemonic-label">הסיפור של קיצו</div>
                  <div className="mnemonic-text" dir="auto">{getMemoryStory(current)}</div>
                </div>
                {getLearningProfile(current) && <div className="answer-anecdote">✨ {getLearningProfile(current).note}</div>}
              </div>
            </div>
          )}

          {quizMode === 'mc' && (
            <div style={{width:'100%', marginTop:12}}>
              <div style={{fontSize:14, color:'var(--text2)', marginBottom:8, textAlign:'center'}}>מה המשמעות?</div>
              {mcOptions.map(opt => {
                let cls = 'mc-option';
                if (mcAnswer) {
                  if (opt.c === current.c) cls += ' correct';
                  else if (opt.c === mcAnswer) cls += ' wrong';
                }
                return (
                  <button type="button" key={opt.c} className={cls} onClick={() => handleMCSelect(opt)} disabled={!!mcAnswer}>
                    {opt.he} ({opt.en})
                  </button>
                );
              })}
              {mcAnswer === current.c && (
                <div role="status" aria-live="polite" style={{textAlign:'center', color:'var(--green)', fontWeight:700}}>נכון!</div>
              )}
            </div>
          )}

          {quizMode === 'typing' && (
            <div style={{width:'100%', marginTop:12}}>
              <div style={{fontSize:14, color:'var(--text2)', marginBottom:8, textAlign:'center'}}>הקלד את המשמעות באנגלית</div>
              <form onSubmit={handleTypingSubmit}>
                <input ref={inputRef} className="typing-input" value={typingVal}
                       onChange={e => setTypingVal(e.target.value)} placeholder="Meaning in English..."
                       disabled={typingResult !== null} autoFocus />
                {typingResult === null && (
                  <button type="submit" className="btn btn-primary btn-full" style={{marginTop:8}}>בדוק</button>
                )}
                {typingResult !== null && (
                  <div role="status" aria-live="polite" style={{textAlign:'center', marginTop:12, fontSize:16, fontWeight:600,
                               color: typingResult ? 'var(--green)' : 'var(--red)'}}>
                    {typingResult ? 'נכון!' : `לא נכון. התשובה: ${current.en} (${current.he})`}
                  </div>
                )}
              </form>
            </div>
          )}
        </div>

        {/* Rating buttons - show for flashcard after flip, or wait for MC/typing auto-advance */}
        {quizMode === 'flashcard' && flipped && pendingRating === null && (
          <div className="rating-btns">
            {INTERVALS.map((iv, i) => (
              <button key={i} className="rating-btn" onClick={() => requestRate(i)}
                      style={{borderColor: i===0?'var(--red)':i===1?'var(--orange)':i===2?'var(--green)':'var(--blue)'}}>
                <span>{iv.label}</span>
                <span className="interval">{getIntervalText(curSrs.level, iv.delta)}</span>
                <span style={{fontSize:10, color:'var(--text3)'}}>{i+1}</span>
              </button>
            ))}
          </div>
        )}
        {pendingRating !== null && (
          <div style={{padding:'0 14px 14px'}}>
            <MistakeCoach kanji={current} attempt={mistakeAttempt}
                          willRetry={!retryCharsRef.current.has(current.c)} onContinue={advanceCard} />
          </div>
        )}
      </div>
    </div>
  );
}

// ======================== EXPLORE PAGE ========================
function ExplorePage({selectedLevels, srsData}) {
  const [activeTab, setActiveTab] = useState('N5');
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);

  const filtered = useMemo(() => {
    let list = KANJI.filter(k => k.j === activeTab);
    if (search) {
      const q = search.toLowerCase();
      list = list.filter(k =>
        k.c.includes(q) || k.en.toLowerCase().includes(q) || k.he.includes(q) ||
        k.on.some(r => r.includes(q)) || k.kun.some(r => r.includes(q))
      );
    }
    return list;
  }, [activeTab, search]);

  return (
    <div className="page">
      <div className="page-title">סייר קאנג'י</div>
      <div className="tabs">
        {['N5','N4','N3','N2','N1'].map(lv => (
          <button key={lv} className={`tab ${activeTab === lv ? 'active' : ''}`}
                  onClick={() => setActiveTab(lv)}>
            {formatLevel(lv)} ({KANJI.filter(k=>k.j===lv).length})
          </button>
        ))}
      </div>
      <input className="search-box" placeholder="חיפוש קאנג'י, משמעות, קריאה..."
             value={search} onChange={e => setSearch(e.target.value)} />
      <div className="explorer-grid">
        {filtered.map(k => {
          const d = srsData[k.c];
          const stage = getStage(d ? d.level : 0);
          const mainReading = k.kun.length > 0 ? k.kun[0].replace('.','') : (k.on.length > 0 ? k.on[0] : '');
          return (
            <div key={k.c} className="explorer-cell" onClick={() => setSelected(k)}
                 style={{borderColor: stage.color + '66'}}>
              {d && d.level > 0 && <div className="cell-stage-dot" style={{background: stage.color}} />}
              <span className="cell-reading">{mainReading}</span>
              <span className="jp" style={{lineHeight:1}}>{k.c}</span>
              <span className="cell-sub">{k.he}</span>
            </div>
          );
        })}
      </div>
      {filtered.length === 0 && <div style={{textAlign:'center', color:'var(--text3)', marginTop:20}}>לא נמצאו תוצאות</div>}

      {selected && (
        <div className="modal-overlay" onClick={() => setSelected(null)}>
          <div className="modal scale-in" onClick={e => e.stopPropagation()}>
            <div style={{textAlign:'center'}}>
              <div className="jp" style={{fontSize:72, fontWeight:900, cursor:'pointer'}}
                   onClick={() => speakJP(selected.c)} title="לחץ להשמעה">{selected.c}</div>
              <button className="speaker-btn" onClick={() => speakJP(selected.c)} title="השמע">🔊</button>
              <div className="badge" style={{background:getStage((srsData[selected.c]||{level:0}).level).color+'33',
                   color:getStage((srsData[selected.c]||{level:0}).level).color, marginBottom:12}}>
                {getStage((srsData[selected.c]||{level:0}).level).name}
              </div>
              <div style={{fontSize:20, fontWeight:600, marginBottom:4}}>{selected.he}</div>
              <div className="ltr" style={{fontSize:16, color:'var(--text2)', marginBottom:12}}>{selected.en}</div>
              <div style={{display:'flex', justifyContent:'center', gap:20, marginBottom:12}}>
                {selected.on.length > 0 && (
                  <div>
                    <div style={{fontSize:11, color:'var(--text3)'}}>אוניומי</div>
                    <div className="jp ltr" style={{color:'var(--amber)', cursor:'pointer'}}
                         onClick={() => speakJP(selected.on.join('、'))}>{selected.on.join('、')}</div>
                  </div>
                )}
                {selected.kun.length > 0 && (
                  <div>
                    <div style={{fontSize:11, color:'var(--text3)'}}>קוניומי</div>
                    <div className="jp ltr" style={{color:'var(--green)', cursor:'pointer'}}
                         onClick={() => speakJP(selected.kun.join('、'))}>{selected.kun.join('、')}</div>
                  </div>
                )}
              </div>
              <div style={{fontSize:13, color:'var(--text3)'}}>משיכות: {selected.s} | רמה: {formatLevel(selected.j)}</div>
              {selected.v && selected.v[0] && (
                <div style={{background:'var(--bg3)', borderRadius:8, padding:12, marginTop:12, cursor:'pointer'}}
                     onClick={() => speakJP(selected.v[0].w)}>
                  <div style={{fontSize:12, color:'var(--text3)', marginBottom:4}}>מילה לדוגמה 🔊</div>
                  <div className="jp ltr" style={{fontSize:20}}>{selected.v[0].w}</div>
                  <div className="jp ltr" style={{fontSize:14, color:'var(--amber)'}}>{selected.v[0].r}</div>
                  <div style={{fontSize:14}}>{selected.v[0].he} ({selected.v[0].en})</div>
                </div>
              )}
              <div style={{marginTop:14, textAlign:'right'}}>
                <div style={{fontSize:14, fontWeight:700, marginBottom:8}}>איך לזכור את הקאנג׳י</div>
                <KanjiLearningPanel key={selected.c} kanji={selected} />
              </div>
              <button className="btn btn-secondary btn-full" style={{marginTop:16}} onClick={() => setSelected(null)}>סגור</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ======================== ADD / SETTINGS PAGE ========================
function AddPage({selectedLevels, toggleLevel, stats, setStats, quizMode, setQuizMode}) {
  const [goal, setGoal] = useState(stats.dailyGoal);

  const applyGoal = () => {
    const g = Math.max(1, Math.min(200, parseInt(goal) || 20));
    setStats(s => ({...s, dailyGoal: g}));
    setGoal(g);
  };

  return (
    <div className="page">
      <div className="page-title">הגדרות</div>
      <div className="card">
        <div style={{fontWeight:600, marginBottom:10}}>רמות פעילות</div>
        <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
          {['N5','N4','N3','N2','N1'].map(lv => (
            <button key={lv} className={`chip ${selectedLevels.includes(lv) ? 'selected' : ''}`}
                    onClick={() => toggleLevel(lv)}>
              {formatLevel(lv)} ({KANJI.filter(k=>k.j===lv).length})
            </button>
          ))}
        </div>
      </div>

      <div className="card">
        <div style={{fontWeight:600, marginBottom:10}}>מצב תרגול</div>
        <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
          {[{k:'flashcard',l:'כרטיסיות'},{k:'mc',l:'רב-ברירה'},{k:'typing',l:'הקלדה'}].map(m => (
            <button key={m.k} className={`chip ${quizMode === m.k ? 'selected' : ''}`}
                    onClick={() => setQuizMode(m.k)}>{m.l}</button>
          ))}
        </div>
      </div>

      <div className="card">
        <div style={{fontWeight:600, marginBottom:10}}>יעד יומי</div>
        <div style={{display:'flex', gap:8, alignItems:'center'}}>
          <input type="number" value={goal} onChange={e => setGoal(e.target.value)}
                 style={{width:80, padding:'8px 12px', borderRadius:8, border:'1px solid var(--bg3)',
                         background:'var(--bg)', color:'var(--text)', fontSize:16, textAlign:'center'}} />
          <span style={{fontSize:14, color:'var(--text2)'}}>חזרות ביום</span>
          <button className="btn btn-sm btn-primary" onClick={applyGoal}>שמור</button>
        </div>
      </div>

      <div className="card">
        <div style={{fontWeight:600, marginBottom:10, color:'var(--red)'}}>איפוס</div>
        <button className="btn btn-sm btn-secondary" onClick={() => {
          if (confirm('לאפס את כל ההתקדמות?')) {
            localStorage.clear();
            location.reload();
          }
        }}>
          איפוס כל הנתונים
        </button>
      </div>

      <div className="card">
        <div style={{fontWeight:600, marginBottom:10}}>קיצורי מקלדת</div>
        <div style={{fontSize:13, color:'var(--text2)'}}>
          <div style={{marginBottom:4}}>רווח — הפוך כרטיס</div>
          <div style={{marginBottom:4}}>1 — שוב (Again)</div>
          <div style={{marginBottom:4}}>2 — קשה (Hard)</div>
          <div style={{marginBottom:4}}>3 — טוב (Good)</div>
          <div>4 — קל (Easy)</div>
        </div>
      </div>
    </div>
  );
}

// ======================== STATS PAGE ========================
function StatsPage({stats, srsData}) {
  const allEntries = Object.entries(srsData);
  const totalLearned = allEntries.filter(([,d]) => d.level >= 1).length;
  const mastered = allEntries.filter(([,d]) => d.level >= 7).length;
  const burned = allEntries.filter(([,d]) => d.level >= 9).length;

  const stageDistribution = {};
  SRS_STAGES.forEach(s => stageDistribution[s.nameEn] = 0);
  allEntries.forEach(([,d]) => {
    const stage = getStage(d.level);
    stageDistribution[stage.nameEn]++;
  });
  // Add unseen
  stageDistribution['New'] = KANJI.length - allEntries.length + (stageDistribution['New'] || 0);

  const maxBar = Math.max(1, ...Object.values(stageDistribution));

  return (
    <div className="page">
      <div className="page-title">סטטיסטיקה</div>

      <div className="card card-glow" style={{textAlign:'center'}}>
        <div style={{fontSize:48, fontWeight:900, color:'var(--amber)'}}>{stats.totalXP}</div>
        <div style={{fontSize:14, color:'var(--text2)'}}>XP כולל</div>
      </div>

      <div className="card">
        <div className="stat-row">
          <span className="stat-label">סה"כ חזרות</span>
          <span className="stat-value">{stats.totalReviews}</span>
        </div>
        <div className="stat-row">
          <span className="stat-label">נלמדו</span>
          <span className="stat-value">{totalLearned}</span>
        </div>
        <div className="stat-row">
          <span className="stat-label">שולטו (מאסטר+)</span>
          <span className="stat-value">{mastered}</span>
        </div>
        <div className="stat-row">
          <span className="stat-label">נצרבו</span>
          <span className="stat-value" style={{color:'var(--amber)'}}>{burned}</span>
        </div>
        <div className="stat-row">
          <span className="stat-label">רצף ימים</span>
          <span className="stat-value">{stats.streak}</span>
        </div>
        <div className="stat-row">
          <span className="stat-label">יעד יומי</span>
          <span className="stat-value">{stats.dailyDone}/{stats.dailyGoal}</span>
        </div>
      </div>

      <div className="card">
        <div style={{fontWeight:600, marginBottom:12}}>התפלגות שלבים</div>
        {SRS_STAGES.map(s => (
          <div key={s.nameEn} style={{marginBottom:8}}>
            <div style={{display:'flex', justifyContent:'space-between', fontSize:13, marginBottom:4}}>
              <span style={{color:s.color}}>{s.name}</span>
              <span style={{fontWeight:600}}>{stageDistribution[s.nameEn]}</span>
            </div>
            <div className="progress-bar">
              <div className="progress-fill" style={{width:`${(stageDistribution[s.nameEn]/maxBar)*100}%`, background:s.color}} />
            </div>
          </div>
        ))}
      </div>

      <div className="card">
        <div style={{fontWeight:600, marginBottom:8}}>התקדמות לפי רמה</div>
        {['N5','N4','N3','N2','N1'].map(lv => {
          const total = KANJI.filter(k => k.j === lv).length;
          const learned = KANJI.filter(k => k.j === lv && srsData[k.c] && srsData[k.c].level >= 1).length;
          return (
            <div key={lv} style={{marginBottom:8}}>
              <div style={{display:'flex', justifyContent:'space-between', fontSize:13, marginBottom:4}}>
                <span>{formatLevel(lv)}</span>
                <span>{learned}/{total}</span>
              </div>
              <div className="progress-bar">
                <div className="progress-fill" style={{width:`${(learned/total)*100}%`, background:'var(--amber)'}} />
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}
