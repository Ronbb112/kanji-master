  {label:'Japan Foundation — Kanji Memory Hint ומשחקי זיכרון', url:'https://www.jpf.go.jp/j/project/japanese/teach/tsushin/news/201704.html'},
  {label:'KanjiVG — נתוני משיכות ורכיבים מורשים', url:'https://kanjivg.tagaini.net/svg-format.html'},
  {label:'שליפה פעילה ושימור לטווח ארוך', url:'https://doi.org/10.1126/science.1152408'},
  {label:'השפעת מרווחי חזרה על שימור', url:'https://pubmed.ncbi.nlm.nih.gov/19076480/'},
  {label:'למידה מטעויות ומשוב מתקן', url:'https://doi.org/10.1146/annurev-psych-010416-044022'},
];

const DAILY_QUICK_TIPS = [
  'כסו את התשובה ונסו להיזכר לפני שאתם הופכים את הכרטיס.',
  'עיגנו כל קריאה במילה אמיתית אחת ואמרו אותה בקול.',
  'פרקו קאנג׳י מורכב לשניים או שלושה רכיבים מוכרים.',
  'אחרי טעות, עצרו לרמז קצר — ואז תנו למערכת להחזיר אותו מוקדם.',
  'השוו קאנג׳י דומים והצביעו על הקו שמבדיל ביניהם.',
  'תרגלו מעט ובעקביות; החזרות במרווחים חשובות יותר ממרתון חד־פעמי.',
  'כתיבה ביד יכולה להיות תרגול נוסף אם גם כתיבה היא יעד שלכם.',
  'אל תשננו את כל הקריאות בבת אחת — למדו אותן דרך מילים.',
];

function TipsPage({srsData}) {
  const [view, setView] = useState('method');
  const [activeLevel, setActiveLevel] = useState('N5');
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);

  useEffect(() => {
    if (!selected) return;
    const closeOnEscape = (event) => { if (event.key === 'Escape') setSelected(null); };
    window.addEventListener('keydown', closeOnEscape);
    return () => window.removeEventListener('keydown', closeOnEscape);
  }, [selected]);

  const levelKanji = useMemo(() => KANJI.filter(k => k.j === activeLevel), [activeLevel]);
  const mistakeCount = useMemo(
    () => levelKanji.filter(k => needsStrengthening(srsData[k.c])).length,
    [levelKanji, srsData]
  );
  const storyCount = useMemo(() => levelKanji.filter(k => !!getLearningProfile(k)).length, [levelKanji]);
  const guideKanji = useMemo(() => {
    const q = search.trim().toLowerCase();
    return levelKanji
      .filter(k => {
        const progress = srsData[k.c];
        if (filter === 'mistakes' && !needsStrengthening(progress)) return false;
        if (filter === 'new' && progress && progress.reviews > 0) return false;
        if (filter === 'stories' && !getLearningProfile(k)) return false;
        if (!q) return true;
        return k.c.includes(q) || k.he.includes(q) || k.en.toLowerCase().includes(q) ||
          k.on.some(r => r.includes(q)) || k.kun.some(r => r.includes(q));
      })
      .sort((a, b) => ((srsData[b.c] && srsData[b.c].wrong) || 0) - ((srsData[a.c] && srsData[a.c].wrong) || 0) || a.s - b.s);
  }, [levelKanji, srsData, filter, search]);

  return (
    <div className="page">
      <section className="guide-hero">
        <div className="jp guide-watermark">覚</div>
        <div className="guide-hero-copy">
          <div className="guide-eyebrow">המעבדה של קיצו</div>
          <h1 className="display-font">לפרק, לדמיין, לזכור</h1>
          <p>מדריך אינטראקטיבי שמפריד בין חלקים שרואים, תפקיד לשוני אמיתי וסיפור זיכרון מקורי.</p>
        </div>
      </section>

      <div className="guide-switch" role="group" aria-label="תצוגת מדריך">
        <button className={view === 'method' ? 'active' : ''} onClick={() => setView('method')} aria-pressed={view === 'method'}>
          השיטה
        </button>
        <button className={view === 'kanji' ? 'active' : ''} onClick={() => setView('kanji')} aria-pressed={view === 'kanji'}>
          מדריך לפי קאנג׳י
        </button>
      </div>

      {view === 'method' ? (
        <div className="fade-in">
          <div style={{fontSize:16, fontWeight:700, margin:'4px 0 10px'}}>לולאת הזיכרון בארבעה צעדים</div>
          <div className="method-loop">
            {LEARNING_METHODS.map(method => (
              <article className="method-step" key={method.num}>
                <div className="method-step-num jp">{method.num}</div>
                <div>
                  <h3>{method.title}</h3>
                  <p>{method.text}</p>
                  <a href={method.url} target="_blank" rel="noreferrer">{method.source} ↗</a>
                  {method.extraUrl && <a href={method.extraUrl} target="_blank" rel="noreferrer" style={{marginInlineStart:8}}>{method.extraSource} ↗</a>}
                </div>
              </article>
            ))}
          </div>

          <div className="card" style={{boxShadow:'none'}}>
            <div style={{fontWeight:700, marginBottom:10}}>מסלול יומי קצר</div>
            <div className="memory-steps">
              <div className="memory-step"><span className="memory-step-icon">א׳</span><div><div className="memory-step-label">למדו 3–5 חדשים</div><div className="memory-step-text">רכיבים, סיפור ומילה אחת לכל קאנג׳י.</div></div></div>
              <div className="memory-step"><span className="memory-step-icon">ב׳</span><div><div className="memory-step-label">שלפו בלי רמז</div><div className="memory-step-text">עברו למצב בדיקה וענו לפני הגילוי.</div></div></div>
              <div className="memory-step"><span className="memory-step-icon">ג׳</span><div><div className="memory-step-label">ערבבו עם ישנים</div><div className="memory-step-text">השתמשו בתרגול „ממתינים” כדי לפגוש פריטים בזמן.</div></div></div>
              <div className="memory-step"><span className="memory-step-icon">ד׳</span><div><div className="memory-step-label">חזרו על הטעויות</div><div className="memory-step-text">פתחו „כדאי לחזק” ובדקו שוב את הרמזים.</div></div></div>
            </div>
          </div>

          <div className="card" style={{boxShadow:'none'}}>
            <div style={{fontWeight:700, marginBottom:4}}>ומה לגבי כתיבה ביד?</div>
            <div style={{fontSize:12, color:'var(--text2)', lineHeight:1.65}}>
              אם המטרה שלכם כוללת כתיבה, העתיקו את הקאנג׳י כמה פעמים מהזיכרון ובדקו את הצורה. זה תרגול אופציונלי — אין צורך לעכב לימוד קריאה עד שסדר הקווים מושלם.
            </div>
          </div>

          <div style={{fontSize:15, fontWeight:700, margin:'18px 0 9px'}}>מקורות מקצועיים ומחקריים</div>
          <div className="source-list">
            {LEARNING_SOURCES.map(source => (
              <a className="source-link" href={source.url} target="_blank" rel="noreferrer" key={source.url}>
                <span>↗</span><span>{source.label}</span>
              </a>
            ))}
          </div>
        </div>
      ) : (
        <div className="fade-in">
          <div className="guide-toolbar">
            <div className="tabs" style={{marginBottom:0}}>
              {['N5','N4','N3','N2','N1'].map(level => (
                <button key={level} className={`tab ${activeLevel === level ? 'active' : ''}`}
                        aria-pressed={activeLevel === level}
                        onClick={() => { setActiveLevel(level); setSelected(null); }}>
                  {formatLevel(level)}
                </button>
              ))}
            </div>
            {activeLevel === 'N5' && (
              <div style={{fontSize:11, color:'var(--text3)', lineHeight:1.55}}>
                „N5 + יסודות” משלב קאנג׳י נפוצים למתחילים עם תווי כיתה א׳ ביפן; ה־JLPT אינו מפרסם רשימת קאנג׳י רשמית.
                {' '}<a href="https://www.jlpt.jp/e/faq/" target="_blank" rel="noreferrer" style={{color:'var(--blue)'}}>הסבר JLPT ↗</a>
              </div>
            )}
            <div style={{fontSize:11, color:'var(--text3)'}}>כשאין פירוק מוכן, הכרטיס מציע תרגיל לבניית רמז אישי.</div>
            <div className="guide-filter-row">
              <button className={`chip ${filter === 'all' ? 'selected' : ''}`} aria-pressed={filter === 'all'} onClick={() => setFilter('all')}>הכול ({levelKanji.length})</button>
              <button className={`chip ${filter === 'stories' ? 'selected' : ''}`} aria-pressed={filter === 'stories'} onClick={() => setFilter('stories')}>סיפור מלא ({storyCount})</button>
              <button className={`chip ${filter === 'mistakes' ? 'selected' : ''}`} aria-pressed={filter === 'mistakes'} onClick={() => setFilter('mistakes')}>כדאי לחזק ({mistakeCount})</button>
              <button className={`chip ${filter === 'new' ? 'selected' : ''}`} aria-pressed={filter === 'new'} onClick={() => setFilter('new')}>חדשים</button>
            </div>
            <label className="sr-only" htmlFor="guide-search">חיפוש במדריך הקאנג׳י</label>
            <input id="guide-search" className="search-box" style={{marginBottom:0}} value={search} onChange={e => setSearch(e.target.value)}
                   placeholder="חיפוש לפי קאנג׳י, משמעות או קריאה..." />
          </div>

          {guideKanji.length > 0 ? (
            <div className="guide-grid">
              {guideKanji.map(k => {
                const needsWork = needsStrengthening(srsData[k.c]);
                return (
                  <button className="guide-kanji-card" key={k.c} onClick={() => setSelected(k)}>
                    <span className="jp guide-kanji-char">{k.c}</span>
                    <span className="guide-kanji-meaning">{k.he}</span>
                    {getLearningProfile(k) && <span className="guide-story-badge">סיפור + פירוק</span>}
                    {needsWork && <span className="guide-mistake-count">לחיזוק</span>}
                  </button>
                );
              })}
            </div>
          ) : (
            <div className="card" style={{textAlign:'center', color:'var(--text2)', boxShadow:'none'}}>
              {filter === 'mistakes' ? 'אין עדיין קאנג׳י לחיזוק ברמה הזו. טעויות מתרגול יופיעו כאן.' : 'לא נמצאו קאנג׳י מתאימים.'}
            </div>
          )}

          {selected && (
            <div className="modal-overlay" onClick={() => setSelected(null)}>
              <div className="modal scale-in" role="dialog" aria-modal="true" aria-label={`מדריך לקאנג׳י ${selected.c}`} onClick={e => e.stopPropagation()}>
                <div style={{textAlign:'center', marginBottom:14}}>
                  <div className="jp" style={{fontSize:72, fontWeight:900}}>{selected.c}</div>
                  <div style={{fontSize:19, fontWeight:700}}>{selected.he}</div>
                  <div className="ltr" style={{fontSize:13, color:'var(--text2)', textAlign:'center'}}>{selected.en}</div>
                </div>
                <KanjiLearningPanel key={selected.c} kanji={selected} />
                <button className="btn btn-secondary btn-full" style={{marginTop:12}} onClick={() => setSelected(null)}>סגור</button>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ======================== NAV BAR ========================
function NavBar({tab, setTab}) {
  const items = [
    {id:'home', icon:'⌁', label:'מסלול'},
    {id:'study', icon:'◆', label:'תרגול'},
    {id:'explore', icon:'漢', label:'קאנג\'י'},
    {id:'tips', icon:'✦', label:'מדריך'},
    {id:'stats', icon:'▥', label:'נתונים'},
  ];
  return (
    <div className="nav-bar">
      {items.map(it => (
        <button key={it.id} className={`nav-btn ${tab === it.id ? 'active' : ''}`}
                onClick={() => setTab(it.id)}>
          <span className="nav-icon">{it.icon}</span>
          <span>{it.label}</span>
        </button>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
